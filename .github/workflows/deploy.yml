name: Deploy MathLineage to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Weekly full rebuild from QLever Wikidata MGP mirror + 5 official thesis archives (Sundays 04:00 UTC)
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Ultra-Scale v4 Genealogy Dataset (7 Official Thesis Repos)
        run: |
          pip install pypdf
          python3 -u backend/scripts/build_full_scale.py
          python3 -c "
          import gzip, json
          from collections import deque
          core = json.loads(gzip.open('frontend/public/data/core.json.gz', 'rb').read())
          edges = json.loads(gzip.open('frontend/public/data/edges.json.gz', 'rb').read())
          theses = json.loads(gzip.open('frontend/public/data/theses.json.gz', 'rb').read())
          assert len(core['n']) > 450000, f'Too few scholars: {len(core[\"n\"])}'
          assert len(edges['a']) > 460000, f'Too few edges: {len(edges[\"a\"])}'
          assert len(theses['d']) > 60000, f'Too few theses: {len(theses[\"d\"])}'
          names_lower = {x.lower() for x in core['n']}
          for req in ['leyi zhu', 'tianrui dai', 'pat hanrahan']:
              assert req in names_lower, f'Missing {req}'
          mgp_to_idx = {m: i for i, m in enumerate(core['m']) if m}
          stu = {}
          for a, s in zip(edges['a'], edges['s']):
              stu.setdefault(a, []).append(s)
          # Verify Leonhard Euler -> Joseph-Louis Lagrange restored (>100,000 descendants)
          e_idx = mgp_to_idx['38586']
          vis, q = {e_idx}, deque([e_idx])
          while q:
              c = q.popleft()
              for nxt in stu.get(c, []):
                  if nxt not in vis:
                      vis.add(nxt); q.append(nxt)
          assert len(vis) - 1 > 100000, f'Euler descendants too low: {len(vis)-1}'
          # Verify Terence Tao gained UCLA students (>=22)
          t_idx = mgp_to_idx['43967']
          assert len(stu.get(t_idx, [])) >= 22, f'Terence Tao students too low: {len(stu.get(t_idx, []))}'
          print('CI v4 verified:', len(core['n']), 'scholars,', len(edges['a']), 'edges,', len(theses['d']), 'theses | Euler desc=', len(vis)-1, '| Tao stu=', len(stu.get(t_idx, [])))
          "

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Frontend SPA
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
