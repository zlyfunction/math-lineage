name: Deploy MathLineage to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Weekly full rebuild from QLever Wikidata MGP mirror + 5 official thesis archives (Sundays 04:00 UTC)
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Ultra-Scale 440K+ Genealogy Dataset
        run: |
          pip install pypdf
          python3 -u backend/scripts/build_full_scale.py
          python3 -c "
          import gzip, json
          core = json.loads(gzip.open('frontend/public/data/core.json.gz', 'rb').read())
          edges = json.loads(gzip.open('frontend/public/data/edges.json.gz', 'rb').read())
          theses = json.loads(gzip.open('frontend/public/data/theses.json.gz', 'rb').read())
          assert len(core['n']) > 380000, f'Too few scholars: {len(core[\"n\"])}'
          assert len(edges['a']) > 400000, f'Too few edges: {len(edges[\"a\"])}'
          assert len(theses['d']) > 30000, f'Too few theses: {len(theses[\"d\"])}'
          names_lower = {x.lower() for x in core['n']}
          assert 'leyi zhu' in names_lower, 'Missing Leyi Zhu'
          assert 'tianrui dai' in names_lower, 'Missing Tianrui Dai'
          assert 'pat hanrahan' in names_lower, 'Missing Pat Hanrahan'
          print('CI dataset integrity verified:', len(core['n']), 'scholars,', len(edges['a']), 'edges,', len(theses['d']), 'theses')
          "

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Frontend SPA
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
